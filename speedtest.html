<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频加载速度对比测试</title>
<style>
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #f6f7fb; color: #161a2e; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 14px 40px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  .muted { color: #6e748c; font-size: 13px; line-height: 1.6; }
  .card { background: #fff; border: 1px solid #e6e8f0; border-radius: 14px; padding: 14px; margin-top: 14px; box-shadow: 0 6px 18px rgba(20, 30, 70, .06); }
  .card h2 { font-size: 17px; margin: 0 0 10px; }
  video { width: 100%; aspect-ratio: 16/9; background: #0d0f1a; border-radius: 10px; display: block; }
  .res { margin-top: 10px; font-size: 15px; line-height: 1.8; }
  .res b { color: #1f5fd6; }
  button { margin-top: 14px; width: 100%; padding: 13px; font-size: 16px; border: none; border-radius: 12px; color: #fff; background: linear-gradient(135deg, #1f5fd6, #2f86f0); font-weight: 600; }
  button:disabled { opacity: .5; }
  .tagA { color: #12a150; } .tagB { color: #b45309; }
</style>
</head>
<body>
<main>
  <h1>视频加载速度对比测试</h1>
  <p class="muted">同一段 75 秒的比赛视频（9.4 MB），A 放在国内服务器，B 放在现在用的 GitHub。<br>
    请分别在<b>微信里</b>和<b>手机浏览器</b>、<b>校园网</b>和<b>4G/5G</b> 下各测一次，把结果截图发给何迪。</p>
  <p class="muted" id="env"></p>

  <div class="card">
    <h2 class="tagA">A　国内服务器（腾讯云）</h2>
    <video id="va" playsinline controls preload="none" poster="videos/7a551708b2f6/02.jpg"></video>
    <div class="res" id="ra">点视频播放，看看能不能播、多久开始动</div>
  </div>
  <div class="card">
    <h2 class="tagB">B　GitHub（现在用的）</h2>
    <video id="vb" playsinline controls preload="none" poster="videos/7a551708b2f6/02.jpg"></video>
    <div class="res" id="rb">点视频播放，看看能不能播、多久开始动</div>
  </div>

  <button id="speed">测下载速度（依次各测 10 秒）</button>
  <div class="card" id="sum" style="display:none"></div>
</main>
<script>
  const SIZE = 9815182, DUR = 74.7;
  const SRC = {
    a: 'https://volleyball-d1gturaysfa4622a2-1507487371.tcloudbaseapp.com/speedtest/02.mp4',
    b: 'videos/7a551708b2f6/02.mp4',
  };
  const ua = navigator.userAgent, conn = navigator.connection && navigator.connection.effectiveType;
  document.getElementById('env').textContent = '当前环境：' + (/MicroMessenger/i.test(ua) ? '微信内置浏览器' : /iPhone|iPad/.test(ua) ? '苹果手机浏览器' : /Android/.test(ua) ? '安卓手机浏览器' : '电脑浏览器')
    + (conn ? ' · 网络类型 ' + conn : '') + ' · ' + new Date().toLocaleString('zh-CN', { hour12: false });
  const kbps = (bytes, s) => bytes / 1024 / s >= 1024 ? (bytes / 1048576 / s).toFixed(1) + ' MB/s' : Math.round(bytes / 1024 / s) + ' KB/s';
  const results = { a: {}, b: {} };

  // 点播放：记录从点击到真正开始播放的时间、以及前 20 秒里卡顿缓冲的次数
  for (const k of ['a', 'b']) {
    const v = document.getElementById('v' + k), out = document.getElementById('r' + k);
    v.src = SRC[k] + '?t=' + Date.now();
    let t0 = 0, stalls = 0, started = false;
    v.addEventListener('play', () => { if (!started) { t0 = performance.now(); out.textContent = '加载中…'; } });
    v.addEventListener('waiting', () => { if (started && v.currentTime < 20) stalls++; });
    v.addEventListener('playing', () => {
      if (started) return;
      started = true;
      const s = (performance.now() - t0) / 1000;
      results[k].start = s;
      out.innerHTML = `✅ 能播放 · 从点击到开始播放 <b>${s.toFixed(1)} 秒</b>`;
      setTimeout(() => { results[k].stalls = stalls; out.innerHTML += `<br>前 20 秒卡顿缓冲 <b>${stalls} 次</b>`; }, 20000);
    });
    v.addEventListener('error', () => { results[k].error = true; out.innerHTML = '❌ <b>播放失败</b>（错误码 ' + (v.error && v.error.code) + '）'; });
    // 同时只播一个，避免互相抢网速
    v.addEventListener('play', () => { const o = document.getElementById(k === 'a' ? 'vb' : 'va'); o.pause(); });
  }

  // 测下载速度：让视频预加载 10 秒，按已缓冲的比例估算下载量（跨域也能测）
  function measure(k) {
    return new Promise(done => {
      const v = document.createElement('video');
      v.muted = true; v.preload = 'auto'; v.playsInline = true;
      v.src = SRC[k] + '?m=' + Date.now();
      const t0 = performance.now();
      let failed = false;
      v.onerror = () => { failed = true; };
      v.load();
      setTimeout(() => {
        const s = (performance.now() - t0) / 1000;
        let sec = 0;
        try { for (let i = 0; i < v.buffered.length; i++) sec = Math.max(sec, v.buffered.end(i)); } catch (e) { }
        const bytes = SIZE * Math.min(1, sec / DUR);
        v.removeAttribute('src'); v.load();
        done(failed ? null : { bytes, s, sec });
      }, 10000);
    });
  }
  document.getElementById('speed').onclick = async e => {
    const btn = e.target; btn.disabled = true;
    const sum = document.getElementById('sum'); sum.style.display = 'block';
    document.querySelectorAll('video').forEach(v => v.pause());
    sum.innerHTML = '正在测 A 国内服务器…（10 秒）';
    const a = await measure('a');
    sum.innerHTML = '正在测 B GitHub…（10 秒）';
    const b = await measure('b');
    const line = (name, r) => r ? `${name}：10 秒内下载约 <b>${(r.bytes / 1048576).toFixed(1)} MB</b>（约 ${r.sec.toFixed(0)} 秒的视频），速度约 <b>${kbps(r.bytes, r.s)}</b>` : `${name}：❌ <b>下载失败</b>`;
    sum.innerHTML = `<div class="res">${line('<span class="tagA">A 国内</span>', a)}<br>${line('<span class="tagB">B GitHub</span>', b)}</div>
      <p class="muted">${document.getElementById('env').textContent}</p><p class="muted">请截图这一屏发给何迪。</p>`;
    btn.disabled = false; btn.textContent = '再测一次';
  };
</script>
</body>
</html>
